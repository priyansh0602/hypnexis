[project]
name = "accesspath-harvester"
version = "0.1.0"
description = "Harvest licensed street-level imagery into AccessPath observations."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyproj==3.8.0",
  "requests==2.34.2",
  "shapely==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
accesspath-harvester = "accesspath_harvester.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
