[project]
name = "accesspath-graph-builder"
version = "0.1.0"
description = "Build left/right footpath segments from OSM road data."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "networkx==3.7",
  "osmnx==2.1.1",
  "pyproj==3.8.0",
  "requests==2.34.2",
  "shapely==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
accesspath-graph-builder = "accesspath_graph_builder.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
